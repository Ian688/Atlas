<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · 探索代码：2D 代码树 / 思维导图 与多展示区</title><link rel="stylesheet" href="style.css">
<style>
/* 本页新增组件：只服务探索页的思维导图提案，不改共享壳。 */
.workspace-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.mm-workspace{display:grid;grid-template-columns:minmax(280px,360px) 6px minmax(0,1fr);gap:0;align-items:start}
.mm-zone{border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.mm-zone-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
.mm-zone-head h3{margin:0;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.mm-zone-head .grow{flex:1}
.mm-seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mm-seg button{border:0;border-radius:0;padding:5px 10px;font-size:11px;background:#fff}
.mm-seg button[aria-pressed=true]{background:var(--tint);color:var(--accent);font-weight:600}
.mm-splitter{background:linear-gradient(90deg,transparent,var(--line),transparent);cursor:col-resize}
.mm-tree{max-height:min(66vh,760px);overflow:auto;padding:6px 4px 12px}
.mm-row-wrap{position:relative}
.mm-row{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:5px 26px 5px 4px;border-radius:7px;text-align:left;font-size:12px}
.mm-row:hover{background:var(--soft)}
.mm-row[aria-selected=true]{background:var(--tint);box-shadow:inset 0 0 0 1px #cfe3d7}
.mm-row .caret{width:14px;color:var(--muted);flex:none;text-align:center}
.mm-row .glyph{width:16px;flex:none;text-align:center;color:var(--accent)}
.mm-row .label{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-row .path{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-row .chips{margin-left:auto;display:flex;gap:4px;flex-wrap:nowrap;flex:none}
.mm-row .chips i{font-style:normal;font-size:10px;padding:1px 5px;border-radius:5px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.mm-row .chips i.warn{color:var(--amber);border-color:#e8d9bd;background:#fdf6e9}
.mm-row .chips i.bad{color:var(--red);border-color:#eed3d0;background:#fdf1f0}
.mm-acts{position:absolute;right:4px;top:3px;display:none;gap:3px}
.mm-row-wrap:hover .mm-acts,.mm-row-wrap:focus-within .mm-acts{display:flex}
.mm-acts button{width:22px;height:22px;padding:0;font-size:11px;line-height:1;border-radius:6px;background:#fff}
.mm-notes{font-size:10.5px;color:var(--muted);padding:0 12px 10px;line-height:1.6}
.mm-invariant{display:flex;gap:8px;align-items:center;padding:8px 12px;margin:8px 12px 4px;border-radius:8px;font-size:11px;background:var(--tint);color:#25574a}
.mm-invariant.bad{background:#fdf1f0;color:var(--red)}
.mm-cover{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.mm-cover span{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--muted)}
.panes{display:grid;gap:10px;padding:10px}
.panes[data-layout=single]{grid-template-columns:minmax(0,1fr)}
.panes[data-layout=double]{grid-template-columns:repeat(2,minmax(0,1fr))}
.panes[data-layout=quad]{grid-template-columns:repeat(2,minmax(0,1fr))}
.pane{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.pane.max{grid-column:1/-1}
.pane-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0;flex-wrap:wrap}
.pane-tabs{display:flex;gap:4px;flex:1;min-width:0;overflow:auto}
.pane-tab{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 8px;border-radius:7px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.pane-tab[aria-current=true]{background:var(--tint);border-color:#cfe3d7;color:var(--accent);font-weight:600}
.pane-tab .x{border:0;background:none;padding:0 2px;font-size:12px;color:var(--muted)}
.pane-acts{display:flex;gap:4px}
.pane-acts button{width:24px;height:24px;padding:0;font-size:11px;line-height:1}
.pane-body{padding:14px;overflow:auto;max-height:min(62vh,700px)}
.pane-empty{color:var(--muted);font-size:12px;line-height:1.8}
.block{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.block>header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:11.5px}
.block>header .grow{flex:1}
.block .body{padding:10px;font-size:12px;line-height:1.7}
.kind{font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.kind.static{color:var(--accent);border-color:#cfe3d7;background:var(--tint)}
.kind.observed{color:#1d6f4d;border-color:#c6e3d3;background:#ecf7f0}
.kind.intent{color:var(--amber);border-color:#e8d9bd;background:#fdf6e9}
.kind.model{color:#6b4a86;border-color:#e0d2ee;background:#f7f2fb}
.kind.write{color:var(--red);border-color:#eed3d0;background:#fdf1f0}
.src{font-size:11.5px;white-space:pre;overflow:auto;background:#fbfcfb;border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.8}
.src mark{background:#fff2c9;outline:1px solid #e7d59a;border-radius:3px}
.intro-sources{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.intro-sources button{font-size:11px;padding:5px 9px}
.intro-sources button[aria-pressed=true]{background:var(--tint);border-color:#cfe3d7;color:var(--accent);font-weight:600}
.flow-list{margin:0;padding-left:16px}
.flow-list li{margin-bottom:4px}
.menu{position:fixed;z-index:60;min-width:268px;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 14px 40px #223d2b26;padding:8px}
.menu h4{margin:6px 8px 4px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.menu button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;font-size:12px}
.menu button:hover{background:var(--soft)}
.menu button .grow{flex:1}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.tab-kind{font-size:10px;color:var(--muted)}
@media(max-width:1150px){.mm-workspace{grid-template-columns:minmax(0,1fr)}.mm-splitter{display:none}.panes[data-layout=double],.panes[data-layout=quad]{grid-template-columns:minmax(0,1fr)}}
</style></head><body>

<aside class="sidebar" data-region="G1" data-region-label="项目与任务导航">
